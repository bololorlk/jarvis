name: ARIS MASTEN Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/aris-masten-windows]
    paths:
      - "aris_masten/**"
      - ".github/workflows/aris-masten-windows.yml"
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r aris_masten/requirements.txt pyinstaller==6.16.0
      - name: Download offline Portuguese speech model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" -OutFile "vosk-pt.zip"
          Expand-Archive "vosk-pt.zip" -DestinationPath "." -Force
          Rename-Item "vosk-model-small-pt-0.3" "vosk-model"
      - name: Verify Python syntax
        shell: pwsh
        run: |
          python -m compileall -q aris_masten
      - name: Build desktop EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ARIS-MASTEN --paths . --add-data "vosk-model;vosk-model" --collect-all vosk --collect-all sounddevice --collect-all edge_tts aris_masten/desktop.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ARIS-MASTEN.exe")) { throw "EXE missing after build" }
          $size = (Get-Item "dist/ARIS-MASTEN.exe").Length
          if ($size -lt 1000000) { throw "EXE unexpectedly small: $size bytes" }
          Write-Host "EXE verified: $size bytes"
      - name: Publish direct EXE download (no ZIP)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "aris-masten-build-${{ github.run_number }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/ARIS-MASTEN.exe" --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag "dist/ARIS-MASTEN.exe" --repo "${{ github.repository }}" --title "ARIS / MASTEN Windows - Build ${{ github.run_number }}" --notes "Requires Ollama and qwen2.5:3b. Download the EXE directly." --latest
          }